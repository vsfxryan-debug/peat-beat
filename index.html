<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0510">
<title>PETSOUNDS · Live Loop Station</title>
<style>
:root{
  --bg:#0a0510; --bg2:#130a20; --panel:#180d2a; --panel2:#221338; --panel3:#2c1a48;
  --line:#33215a; --line2:#4a2e7a;
  --text:#f3e9ff; --dim:#8b7ba8; --dim2:#5c4a7a;
  --pink:#ff2e97; --cyan:#00e5ff; --yellow:#ffe600; --green:#00ff88;
  --red:#ff3b3b; --orange:#ff7a1a; --purple:#b48cff;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --shadow: 0 4px 0 #050208;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{
  margin:0; padding:0; background:var(--bg); color:var(--text);
  font-family:var(--mono); overflow-x:hidden;
  min-height:100vh;
  background-image:
    radial-gradient(ellipse at 15% -10%, rgba(255,46,151,.10), transparent 55%),
    radial-gradient(ellipse at 90% 0%, rgba(0,229,255,.09), transparent 50%),
    radial-gradient(ellipse at 50% 120%, rgba(180,140,255,.07), transparent 60%);
  background-attachment:fixed;
}
body{padding:10px 10px 40px; max-width:1180px; margin:0 auto; font-size:13px;}

h1,h2,h3{margin:0; font-weight:800; letter-spacing:.16em; font-size:10px; text-transform:uppercase;}
button{font-family:var(--mono); cursor:pointer; border:0; background:none; color:inherit;}

/* =================== TOP BAR =================== */
.topbar{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:linear-gradient(180deg,#231440,#160c26);
  border:1px solid var(--line2); border-radius:16px; padding:10px 14px;
  box-shadow:var(--shadow), 0 0 30px rgba(180,140,255,.05);
  margin-bottom:10px;
}
.logo{
  font-size:14px; font-weight:900; letter-spacing:.2em;
  background:linear-gradient(90deg,var(--pink),var(--purple),var(--cyan));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  white-space:nowrap;
}
.logo small{display:block; font-size:8px; letter-spacing:.24em; color:var(--dim2); -webkit-text-fill-color:var(--dim2); margin-top:2px;}
.spacer{flex:1;}
.ctrl{display:flex; flex-direction:column; gap:2px; align-items:center;}
.ctrl label{font-size:8px; color:var(--dim); letter-spacing:.2em;}
.ctrl .v{font-size:9px; color:var(--cyan); font-weight:700;}
input[type=range]{-webkit-appearance:none; appearance:none; width:82px; height:20px; background:transparent; cursor:pointer;}
input[type=range]::-webkit-slider-runnable-track{height:5px; border-radius:3px; background:#2a1a45;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px; margin-top:-5px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); border:0;}
input[type=range]::-moz-range-track{height:5px; border-radius:3px; background:#2a1a45;}
input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--cyan); box-shadow:0 0 8px var(--cyan); border:0;}

#playBtn{
  width:56px; height:56px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#3a2560,#1c1030);
  border:2px solid var(--line2); color:var(--text); font-size:20px;
  box-shadow:var(--shadow), inset 0 1px 0 rgba(255,255,255,.1);
  transition:.1s; display:flex; align-items:center; justify-content:center;
}
#playBtn:active{transform:translateY(3px); box-shadow:0 1px 0 #050208;}
#playBtn.on{
  background:radial-gradient(circle at 35% 30%,#ff5cae,#a3005c);
  border-color:#ff6ebc; color:#fff;
  box-shadow:0 4px 0 #3d0023, 0 0 30px rgba(255,46,151,.5);
  animation:pulsePlay 1.6s ease-in-out infinite;
}
@keyframes pulsePlay{50%{box-shadow:0 4px 0 #3d0023, 0 0 44px rgba(255,46,151,.75);}}

.segs{display:flex; border:1px solid var(--line2); border-radius:9px; overflow:hidden;}
.segs button{background:#221338; padding:6px 9px; font-size:10px; color:var(--dim); transition:.1s; min-width:28px;}
.segs button.on{background:var(--cyan); color:#041018; font-weight:800; box-shadow:0 0 12px rgba(0,229,255,.4);}
.segs button:hover:not(.on){background:#2c1a48;}

/* =================== SOURCE PANEL =================== */
.source{
  background:linear-gradient(180deg,#180d2a,#12091f);
  border:1px solid var(--line); border-radius:16px; padding:12px 14px;
  box-shadow:var(--shadow); margin-bottom:10px;
}
.src-head{display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:10px;}
.src-head h2{color:var(--dim);}
.src-name{
  flex:1; min-width:120px;
  font-size:11px; letter-spacing:.08em;
  padding:6px 12px; background:#0d0618; border-radius:8px;
  border:1px solid var(--line); color:var(--cyan);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.src-name.empty{color:var(--dim2); font-style:italic;}
.src-actions{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}

.btn{
  background:linear-gradient(180deg,#2c1a48,#1e1033);
  border:1px solid var(--line2); color:var(--text);
  padding:8px 13px; border-radius:9px; font-size:10px; letter-spacing:.1em;
  font-weight:700; transition:.1s; text-transform:uppercase;
  box-shadow:0 2px 0 #0a0515, inset 0 1px 0 rgba(255,255,255,.08);
  white-space:nowrap;
}
.btn:hover:not(:disabled){background:linear-gradient(180deg,#38225c,#241540);}
.btn:active:not(:disabled){transform:translateY(2px); box-shadow:0 0 0 #0a0515;}
.btn:disabled{opacity:.3; cursor:not-allowed;}
.btn.mic{background:linear-gradient(180deg,#2e2060,#1a0f38); border-color:var(--purple);}
.btn.mic.live{border-color:var(--green); box-shadow:0 0 16px rgba(0,255,136,.35), 0 2px 0 #0a0515; color:var(--green);}
.btn.snag{
  background:linear-gradient(180deg,#ff3b3b,#a30000); border-color:#ff6b6b; color:#fff;
  box-shadow:0 3px 0 #4d0000, 0 0 20px rgba(255,59,59,.4);
  padding:10px 16px; font-size:11px;
}
.btn.snag:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 #4d0000;}
.btn.accent{background:linear-gradient(180deg,#ff2e97,#8a0050); border-color:#ff6ebc; color:#fff; box-shadow:0 3px 0 #2a0018;}
.btn.accent:active:not(:disabled){transform:translateY(2px); box-shadow:0 1px 0 #2a0018;}

#micWave{
  display:block; width:100%; height:64px;
  background:#0a0515; border:1px solid var(--line); border-radius:10px;
  margin-top:10px;
}
@media(max-width:560px){ #micWave{height:50px;} }

/* =================== TRACKS =================== */
.tracks-panel{
  background:linear-gradient(180deg,#180d2a,#12091f);
  border:1px solid var(--line); border-radius:16px; padding:12px 14px;
  box-shadow:var(--shadow); margin-bottom:10px;
}
.tracks-head{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.tracks-head h2{color:var(--dim);}
.tracks-head .hint{font-size:9px; color:var(--dim2); letter-spacing:.08em;}
#tracks{display:flex; flex-direction:column; gap:8px;}

.track{
  --tc: var(--pink);
  display:grid;
  grid-template-columns:auto 1fr auto;
  grid-template-rows:auto auto;
  gap:8px 12px;
  align-items:center;
  background:linear-gradient(180deg,#1c112f,#150c24);
  border:1px solid var(--line); border-radius:12px;
  padding:9px 12px;
  transition:.15s;
  position:relative;
  overflow:hidden;
}
.track.armed{border-color:var(--tc); box-shadow:0 0 0 1px var(--tc), 0 0 24px -6px var(--tc);}
.track.recording{background:linear-gradient(180deg,#2c0b18,#1c0812);}

.track-badge{
  display:flex; align-items:center; gap:8px;
  font-size:10px; letter-spacing:.14em; font-weight:800;
}
.track-dot{width:8px; height:8px; border-radius:50%; background:var(--tc); box-shadow:0 0 10px var(--tc);}
.track-name{color:var(--tc);}
.track-status{font-size:8px; color:var(--dim2); letter-spacing:.14em; margin-left:4px;}

.track-viz{
  grid-column:1/-1;
  height:28px; background:#0a0515; border-radius:7px;
  border:1px solid #1c1230; position:relative; overflow:hidden;
}
.track-viz canvas{display:block; width:100%; height:100%;}
.track-viz .playhead{
  position:absolute; top:0; bottom:0; width:2px; left:0;
  background:rgba(0,229,255,.85);
  box-shadow:0 0 8px rgba(0,229,255,.7);
  pointer-events:none;
  transform:translateX(calc(var(--ph,0) * 100%));
}
.track-viz .recbar{
  position:absolute; top:0; bottom:0; left:0; width:0%;
  background:linear-gradient(90deg, rgba(255,59,59,.5), rgba(255,59,59,.15));
  pointer-events:none;
  transition:width .05s linear;
}

.track-ctrls{display:flex; gap:6px; align-items:center;}
.track-ctrls .mini{
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
.track-ctrls .mini label{font-size:7px; color:var(--dim2); letter-spacing:.14em;}
.track-ctrls .mini input[type=range]{width:56px; height:16px;}
.track-ctrls .mini input[type=range]::-webkit-slider-runnable-track{height:4px; background:#2a1a45;}
.track-ctrls .mini input[type=range]::-webkit-slider-thumb{width:12px; height:12px; margin-top:-4px; background:var(--tc); box-shadow:0 0 6px var(--tc);}
.track-ctrls .mini input[type=range]::-moz-range-thumb{background:var(--tc); box-shadow:0 0 6px var(--tc); width:11px; height:11px;}

.rec-btn{
  background:linear-gradient(180deg,#2c1a48,#1a0f30);
  border:1px solid var(--line2); border-radius:8px;
  padding:6px 10px; font-size:9px; letter-spacing:.14em; font-weight:800;
  color:var(--dim); transition:.12s;
  box-shadow:0 2px 0 #050208;
  display:flex; align-items:center; gap:5px;
}
.rec-btn:hover{color:var(--text); background:linear-gradient(180deg,#38225c,#241540);}
.rec-btn .led{width:7px; height:7px; border-radius:50%; background:#3a2c58; transition:.12s;}
.rec-btn.armed{border-color:var(--tc); color:var(--tc);}
.rec-btn.armed .led{background:var(--tc); box-shadow:0 0 10px var(--tc); animation:blink 1s infinite;}
.rec-btn.rec-on{background:linear-gradient(180deg,#ff3b3b,#8a0000); border-color:#ff6b6b; color:#fff; box-shadow:0 0 20px rgba(255,59,59,.5), 0 2px 0 #3d0000;}
.rec-btn.rec-on .led{background:#fff; box-shadow:0 0 12px #fff;}
@keyframes blink{50%{opacity:.35;}}

.mini-btn{
  width:26px; height:26px; border-radius:7px;
  background:#1e1235; border:1px solid var(--line);
  color:var(--dim); font-size:10px; font-weight:800;
  display:flex; align-items:center; justify-content:center;
  transition:.12s;
}
.mini-btn:hover{color:var(--text); border-color:var(--line2);}
.mini-btn.on{background:var(--tc); color:#0a0510; border-color:var(--tc); box-shadow:0 0 12px var(--tc);}
.mini-btn.danger:hover{color:var(--red); border-color:var(--red);}

/* =================== INSTRUMENTS =================== */
.inst-panel{
  background:linear-gradient(180deg,#180d2a,#12091f);
  border:1px solid var(--line); border-radius:16px; padding:12px 14px;
  box-shadow:var(--shadow);
}
.tabs{display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap;}
.tabs button{
  background:#1e1235; border:1px solid var(--line); color:var(--dim);
  padding:9px 14px; border-radius:10px; font-size:10px; letter-spacing:.14em;
  font-weight:800; transition:.12s; text-transform:uppercase;
}
.tabs button:hover{color:var(--text);}
.tabs button.on{
  background:linear-gradient(180deg,var(--purple),#5c3bb0);
  color:#fff; border-color:#c7aaff;
  box-shadow:0 0 20px rgba(180,140,255,.4), inset 0 1px 0 rgba(255,255,255,.2);
}
.tab-body{min-height:240px;}

/* KEYS */
.keys-wrap{
  position:relative;
  background:#0a0515; border-radius:12px; padding:14px 10px 10px;
  border:1px solid var(--line);
  overflow-x:auto;
  user-select:none;
}
.keys{display:flex; justify-content:center; min-width:100%; position:relative; height:170px;}
.key{
  position:relative;
  display:flex; flex-direction:column; justify-content:flex-end; align-items:center;
  padding-bottom:8px;
  border-radius:0 0 8px 8px;
  font-size:9px; letter-spacing:.06em; color:#5a4a7a;
  cursor:pointer; transition:.05s;
  user-select:none;
  touch-action:none;
}
.key.white{
  flex:1; min-width:42px;
  background:linear-gradient(180deg,#f3e9ff,#c9b8e0);
  border:1px solid #0a0515;
  border-top:0;
  z-index:1;
  box-shadow:inset 0 -8px 14px rgba(90,70,140,.25), 0 3px 0 #6b5590;
}
.key.white:hover{background:linear-gradient(180deg,#fff,#d9c8f0);}
.key.white.pressed{background:linear-gradient(180deg,#ffe6f5,#ff8fc7); color:#4a0030; box-shadow:inset 0 -4px 10px rgba(0,0,0,.2), 0 1px 0 #6b5590; transform:translateY(2px);}
.key.black{
  position:absolute; top:0; width:26px; height:100px;
  background:linear-gradient(180deg,#231640,#0f0820);
  border:1px solid #000; border-top:0; border-radius:0 0 5px 5px;
  z-index:2; color:#8b7ba8;
  box-shadow:0 3px 0 #050208;
  padding-bottom:5px;
}
.key.black:hover{background:linear-gradient(180deg,#3a2366,#1a0e30);}
.key.black.pressed{background:linear-gradient(180deg,#ff5cae,#a3005c); color:#fff; transform:translateY(2px); box-shadow:0 1px 0 #050208;}
.key .kb{font-size:8px; color:#8a7ba8; margin-top:2px; opacity:.7;}
.key.black .kb{color:#6b5a8a; font-size:7px;}

.keys-footer{display:flex; justify-content:space-between; align-items:center; margin-top:10px; gap:10px; flex-wrap:wrap;}
.keys-footer .hint{font-size:9px; color:var(--dim2); letter-spacing:.1em;}
.oct-ctl{display:flex; gap:6px; align-items:center;}
.oct-ctl label{font-size:9px; color:var(--dim); letter-spacing:.14em;}

/* PADS */
.pads-wrap{display:flex; justify-content:center;}
.pads{
  display:grid; grid-template-columns:repeat(4, 1fr);
  gap:10px; width:100%; max-width:620px;
  padding:12px;
  background:#0a0515; border-radius:14px;
  border:1px solid var(--line);
}
.pad{
  aspect-ratio:1.05;
  border-radius:12px;
  background:linear-gradient(180deg,#241640,#150d28);
  border:1px solid var(--line2);
  color:var(--dim);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px;
  transition:.08s;
  box-shadow:0 4px 0 #050208, inset 0 1px 0 rgba(255,255,255,.08);
  position:relative;
  overflow:hidden;
  touch-action:none;
}
.pad:hover{background:linear-gradient(180deg,#31215a,#1e1238); color:var(--text);}
.pad:active, .pad.hit{
  transform:translateY(3px);
  box-shadow:0 1px 0 #050208;
  background:linear-gradient(180deg,var(--pink),#a3005c);
  color:#fff; border-color:#ff6ebc;
}
.pad .pname{font-size:10px; font-weight:800; letter-spacing:.08em;}
.pad .pkey{font-size:8px; color:var(--dim2); letter-spacing:.1em;}
.pad.hit .pkey{color:#ffe; opacity:.7;}
.pad .pdot{
  position:absolute; top:6px; right:7px; width:5px; height:5px;
  border-radius:50%; background:var(--line2); transition:.1s;
}
.pad.hit .pdot{background:#fff; box-shadow:0 0 8px #fff;}

/* SHAKER */
.shaker-wrap{
  display:flex; flex-direction:column; align-items:center; gap:16px;
  padding:14px;
}
.shaker-big{
  width:170px; height:170px; border-radius:50%;
  background:radial-gradient(circle at 35% 28%, #3a2560, #1a0e2e);
  border:3px solid var(--line2);
  color:var(--text); font-size:15px; letter-spacing:.16em; font-weight:800;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  box-shadow:0 8px 0 #050208, inset 0 2px 0 rgba(255,255,255,.1), 0 0 40px rgba(180,140,255,.15);
  transition:.08s;
  touch-action:none;
}
.shaker-big:active, .shaker-big.hit{
  transform:translateY(5px);
  box-shadow:0 3px 0 #050208, inset 0 2px 0 rgba(255,255,255,.2), 0 0 60px rgba(0,229,255,.5);
  border-color:var(--cyan);
  background:radial-gradient(circle at 35% 28%, #2d5a6e, #0a2030);
  color:var(--cyan);
}
.shaker-big small{font-size:9px; color:var(--dim); letter-spacing:.16em;}

.shaker-styles{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
.shaker-style{
  padding:8px 14px; border-radius:9px; background:#1e1235; border:1px solid var(--line);
  color:var(--dim); font-size:10px; letter-spacing:.1em; font-weight:700;
  transition:.12s;
}
.shaker-style:hover{color:var(--text);}
.shaker-style.on{background:var(--cyan); color:#041018; border-color:var(--cyan); box-shadow:0 0 16px rgba(0,229,255,.4);}

.shaker-controls{display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center;}
.roll-btn{
  padding:11px 22px; border-radius:11px; font-size:11px; letter-spacing:.16em; font-weight:800;
  background:linear-gradient(180deg,#2c1a48,#1a0f30); border:1px solid var(--line2); color:var(--text);
  box-shadow:0 3px 0 #050208; transition:.12s;
}
.roll-btn:active{transform:translateY(2px); box-shadow:0 1px 0 #050208;}
.roll-btn.on{
  background:linear-gradient(180deg,#00ff88,#008040); color:#00281a;
  border-color:#5fffaa; box-shadow:0 0 24px rgba(0,255,136,.5), 0 3px 0 #004020;
}

/* VOX */
.vox-wrap{display:flex; flex-direction:column; align-items:center; gap:16px; padding:10px 14px;}
.vox-rec{
  width:180px; height:180px; border-radius:50%;
  background:radial-gradient(circle at 35% 28%, #5c1a3a, #2a0818);
  border:3px solid #8a2050;
  color:#ff8fc7; font-size:14px; letter-spacing:.16em; font-weight:800;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;
  box-shadow:0 8px 0 #050208, inset 0 2px 0 rgba(255,255,255,.1), 0 0 40px rgba(255,46,151,.2);
  transition:.1s;
  touch-action:none;
}
.vox-rec:active{transform:translateY(5px); box-shadow:0 3px 0 #050208;}
.vox-rec.rec{
  background:radial-gradient(circle at 35% 28%, #ff3b3b, #7a0000);
  border-color:#ff6b6b; color:#fff;
  animation:pulseRec .55s ease-in-out infinite;
  box-shadow:0 8px 0 #3d0000, inset 0 2px 0 rgba(255,255,255,.3), 0 0 70px rgba(255,59,59,.7);
}
.vox-rec.armed{
  border-color:#ff8fc7; color:#ff8fc7;
  box-shadow:0 8px 0 #050208, 0 0 40px rgba(255,46,151,.5);
  animation:pulseArm .8s ease-in-out infinite;
}
@keyframes pulseRec{50%{box-shadow:0 8px 0 #3d0000, inset 0 2px 0 rgba(255,255,255,.3), 0 0 90px rgba(255,59,59,.9);}}
@keyframes pulseArm{50%{box-shadow:0 8px 0 #050208, 0 0 60px rgba(255,46,151,.8);}}
.vox-rec small{font-size:9px; color:inherit; opacity:.75; letter-spacing:.14em;}

.vox-controls{display:flex; gap:12px; align-items:center; flex-wrap:wrap; justify-content:center;}
.vox-controls select{
  background:#1e1235; border:1px solid var(--line); color:var(--text);
  padding:9px 12px; border-radius:9px; font-family:var(--mono);
  font-size:10px; letter-spacing:.1em; font-weight:700;
}
.vox-hint{font-size:9px; color:var(--dim2); letter-spacing:.1em; text-align:center; max-width:400px;}

.vox-wave{
  width:100%; max-width:520px; height:70px;
  background:#0a0515; border:1px solid var(--line); border-radius:10px;
}

/* toast */
#toast{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%) translateY(20px);
  background:linear-gradient(180deg,#2c1a48,#1a0f30);
  border:1px solid var(--line2); color:var(--text);
  padding:11px 20px; border-radius:24px; font-size:10px; letter-spacing:.12em;
  opacity:0; pointer-events:none; transition:.25s; z-index:99;
  box-shadow:0 4px 0 #050208, 0 0 30px rgba(180,140,255,.25);
  font-weight:700; text-transform:uppercase;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.empty-note{
  padding:30px 20px; text-align:center; color:var(--dim2);
  font-size:10px; letter-spacing:.14em; border:1px dashed var(--line);
  border-radius:12px;
}

@media(max-width:640px){
  body{padding:8px 8px 30px;}
  .topbar{padding:9px 11px; gap:8px; border-radius:13px;}
  .logo{font-size:12px;}
  .ctrl input[type=range]{width:64px;}
  #playBtn{width:48px; height:48px; font-size:17px;}
  .track{grid-template-columns:auto 1fr; padding:8px 10px; gap:6px 8px;}
  .track-ctrls{grid-column:1/-1; justify-content:flex-start;}
  .keys{height:145px;}
  .key.white{min-width:34px;}
  .key.black{width:22px; height:85px;}
  .pads{gap:7px; padding:9px;}
  .pad .pname{font-size:9px;}
  .shaker-big, .vox-rec{width:140px; height:140px; font-size:12px;}
}
</style>
</head>

<div id="toast"></div>

<script>
(() => {
"use strict";

/* ═══════════════════════════════════════════════════════════
   1. STATE
   ═══════════════════════════════════════════════════════════ */
const COLORS = {
  0: { main:'#ff2e97', glow:'rgba(255,46,151,' },
  1: { main:'#00e5ff', glow:'rgba(0,229,255,' },
  2: { main:'#ffe600', glow:'rgba(255,230,0,' },
  3: { main:'#00ff88', glow:'rgba(0,255,136,' },
};

const S = {
  ctx: null,
  master: null,
  micStream: null,
  micNode: null,
  micGain: null,
  micWorkletReady: false,

  sourceBuffer: null,
  sourceName: '',
  snagSeconds: 3,

  bpm: 100,
  bars: 4,
  volume: 0.85,
  playing: false,
  transportStart: 0,
  loopDuration: 9.6,
  nextLoopToSchedule: 0,
  timer: null,
  rafId: null,

  tracks: [],
  activeTab: 'keys',
  keysOctave: 0,

  rollOn: false,
  rollTimer: null,
  shakerStyle: 'tick',
};

/* ═══════════════════════════════════════════════════════════
   2. AUDIO CONTEXT + WORKLET
   ═══════════════════════════════════════════════════════════ */
const WORKLET_SRC = `
class MicEngine extends AudioWorkletProcessor {
  constructor() {
    super();
    this.size = Math.ceil(sampleRate * 30);
    this.buf = new Float32Array(this.size);
    this.write = 0; this.filled = 0;
    this.peakAcc = 0; this.peakCount = 0;
    this.hop = 1024;
    this.peaks = [];
    this.recStart = -1;
    this.port.onmessage = (e) => {
      const d = e.data;
      if (d.type === 'snag') {
        const n = Math.min(Math.floor(d.seconds * sampleRate), this.filled);
        const out = new Float32Array(n);
        let r = (this.write - n + this.size) % this.size;
        for (let i = 0; i < n; i++) { out[i] = this.buf[r]; r = (r + 1) % this.size; }
        this.port.postMessage({ type: 'snagged', samples: out, sampleRate }, [out.buffer]);
      } else if (d.type === 'rec-start') {
        this.recStart = this.write;
      } else if (d.type === 'rec-stop') {
        if (this.recStart >= 0) {
          const len = (this.write - this.recStart + this.size) % this.size;
          const out = new Float32Array(len);
          let r = this.recStart;
          for (let i = 0; i < len; i++) { out[i] = this.buf[r]; r = (r + 1) % this.size; }
          this.port.postMessage({ type: 'vocal-captured', samples: out, sampleRate, trackId: d.trackId }, [out.buffer]);
          this.recStart = -1;
        }
      }
    };
  }
  process(inputs, outputs) {
    const inp = inputs[0]; const out = outputs[0];
    if (out && out[0]) out[0].fill(0);
    if (inp && inp[0]) {
      const ch = inp[0];
      for (let i = 0; i < ch.length; i++) {
        const v = ch[i];
        this.buf[this.write] = v;
        this.write = (this.write + 1) % this.size;
        const a = v < 0 ? -v : v;
        if (a > this.peakAcc) this.peakAcc = a;
        if (++this.peakCount >= this.hop) {
          this.peaks.push(this.peakAcc); this.peakAcc = 0; this.peakCount = 0;
        }
      }
      this.filled = Math.min(this.filled + ch.length, this.size);
      if (this.peaks.length >= 4) {
        this.port.postMessage({ type: 'peaks', values: this.peaks, hop: this.hop, sampleRate });
        this.peaks = [];
      }
    }
    return true;
  }
}
registerProcessor('mic-engine', MicEngine);
`;

async function ensureCtx() {
  if (S.ctx) {
    if (S.ctx.state === 'suspended') try { await S.ctx.resume(); } catch(e){}
    return S.ctx;
  }
  S.ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  S.master = S.ctx.createGain();
  S.master.gain.value = S.volume;
  S.master.connect(S.ctx.destination);

  for (const t of S.tracks) {
    t.gain = S.ctx.createGain();
    t.gain.gain.value = t.muted ? 0 : t.vol;
    t.gain.connect(S.master);
  }
  updateLoopDuration();
  return S.ctx;
}

/* ═══════════════════════════════════════════════════════════
   3. TRACKS
   ═══════════════════════════════════════════════════════════ */
function makeTrack(id, name) {
  return {
    id, name,
    events: [],
    vocalBuffer: null,
    muted: false,
    vol: 0.9,
    pitch: 1.0,
    recording: false,
    armed: false,
    recordingType: null,      // 'events' | 'vocal'
    recordingStartTime: 0,
    recordingEndTime: 0,
    recordingLoopIdx: -1,
    gain: null,
    _scheduled: [],
  };
}
S.tracks = [makeTrack(0,'TRK 1'), makeTrack(1,'TRK 2'), makeTrack(2,'TRK 3'), makeTrack(3,'TRK 4')];

function trackHasContent(t) { return t.events.length > 0 || !!t.vocalBuffer; }

/* ═══════════════════════════════════════════════════════════
   4. TRANSPORT
   ═══════════════════════════════════════════════════════════ */
function updateLoopDuration() {
  S.loopDuration = S.bars * 4 * (60 / S.bpm);
}

async function startTransport() {
  await ensureCtx();
  if (S.playing) return;
  S.transportStart = S.ctx.currentTime + 0.12;
  S.nextLoopToSchedule = 0;
  S.playing = true;
  if (S.timer) clearInterval(S.timer);
  S.timer = setInterval(scheduler, 22);
  scheduler();
  startVisualLoop();
  updateTransportUI();
}

function stopTransport() {
  S.playing = false;
  if (S.timer) { clearInterval(S.timer); S.timer = null; }
  if (S.rafId) { cancelAnimationFrame(S.rafId); S.rafId = null; }
  for (const t of S.tracks) {
    for (const src of t._scheduled) { try { src.stop(); } catch(e){} }
    t._scheduled = [];
    if (t.recording) { t.recording = false; t.armed = false; if (t.recordingType==='vocal' && S.micNode) S.micNode.port.postMessage({type:'rec-stop', trackId:t.id}); }
    t.recordingType = null;
  }
  document.querySelectorAll('.playhead').forEach(e => e.style.setProperty('--ph','0'));
  updateTransportUI();
  renderTracks();
}

function scheduler() {
  if (!S.playing || !S.ctx) return;
  const now = S.ctx.currentTime;
  const horizon = now + 0.22;

  while (true) {
    const loopStart = S.transportStart + S.nextLoopToSchedule * S.loopDuration;
    if (loopStart > horizon) break;
    scheduleLoop(S.nextLoopToSchedule, loopStart);
    S.nextLoopToSchedule++;
  }

  // Check for recording end
  for (const t of S.tracks) {
    if (t.recording && now >= t.recordingEndTime) {
      t.recording = false;
      t.armed = false;
      if (t.recordingType === 'vocal') {
        if (S.micNode) S.micNode.port.postMessage({ type: 'rec-stop', trackId: t.id });
        // fallback stop in case mic not available
        setTimeout(() => { if (t.recording) t.recording = false; }, 200);
      } else {
        toast('🎯 ' + t.name + ' loop captured');
      }
      t.recordingType = null;
      renderTracks();
    }
  }
}

function scheduleLoop(loopIdx, loopStart) {
  if (!S.sourceBuffer && !S.tracks.some(t => t.vocalBuffer)) return;

  for (const t of S.tracks) {
    if (t.muted) continue;

    // vocal buffer
    if (t.vocalBuffer) {
      const src = S.ctx.createBufferSource();
      src.buffer = t.vocalBuffer;
      const rateAdj = t.vocalBuffer.duration / S.loopDuration;
      src.playbackRate.value = Math.max(0.25, Math.min(4, t.pitch * rateAdj));
      src.connect(t.gain);
      src.start(loopStart);
      t._scheduled.push(src);
      src.onended = () => {
        const i = t._scheduled.indexOf(src);
        if (i >= 0) t._scheduled.splice(i, 1);
      };
    }

    // events
    if (S.sourceBuffer) {
      for (const ev of t.events) {
        const time = loopStart + ev.time;
        if (time < S.ctx.currentTime) continue;
        trigger(ev.params, time, t.gain, ev.rate * t.pitch);
      }
    }
  }
}

/* ═══════════════════════════════════════════════════════════
   5. SOUND TRIGGER
   ═══════════════════════════════════════════════════════════ */
function trigger(params, time, dest, rateMul) {
  if (!S.sourceBuffer || !S.ctx) return;
  const ac = S.ctx;
  const src = ac.createBufferSource();
  src.buffer = S.sourceBuffer;
  src.playbackRate.value = Math.max(0.25, Math.min(4, (params.rate ?? 1) * (rateMul ?? 1)));

  let head = src;
  if (params.filter) {
    const f = ac.createBiquadFilter();
    f.type = params.filter.type;
    f.frequency.value = params.filter.freq;
    f.Q.value = params.filter.q ?? 1;
    head.connect(f);
    head = f;
  }
  const g = ac.createGain();
  const peak = Math.max(0.001, params.gain ?? 0.9);
  const decay = Math.max(0.02, params.decay ?? 0.3);
  g.gain.setValueAtTime(0.0001, time);
  g.gain.exponentialRampToValueAtTime(peak, time + 0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, time + decay);
  head.connect(g);
  g.connect(dest || S.master);
  src.start(time);
  src.stop(time + decay + 0.06);
}

/* ═══════════════════════════════════════════════════════════
   6. RECORDING
   ═══════════════════════════════════════════════════════════ */
function armTrack(track, type) {
  ensureCtx().then(() => {
    if (!S.playing) startTransport();

    // find next loop boundary with enough lead time
    const now = S.ctx.currentTime;
    let idx = Math.max(0, Math.ceil((now - S.transportStart) / S.loopDuration));
    if (idx < S.nextLoopToSchedule) idx = S.nextLoopToSchedule;
    let start = S.transportStart + idx * S.loopDuration;
    if (start - now < 0.35) { idx++; start += S.loopDuration; }

    // toggle off if already armed
    if (track.armed && track.recordingType === type) {
      track.armed = false; track.recording = false; track.recordingType = null;
      renderTracks(); return;
    }

    // disarm all others
    for (const t of S.tracks) {
      if (t !== track && t.armed) { t.armed = false; t.recording = false; t.recordingType = null; }
    }

    track.armed = true;
    track.recordingType = type;
    track.recordingStartTime = start;
    track.recordingEndTime = start + S.loopDuration;
    track.events = [];
    track.vocalBuffer = null;

    if (type === 'vocal') {
      if (!S.micNode) { toast('Enable the mic first 🎤'); track.armed = false; renderTracks(); return; }
      S.micNode.port.postMessage({ type: 'rec-start' });
    }

    toast('🔴 ' + track.name + ' ARMED — starts on next bar');
    renderTracks();
  });
}

// called when a sound plays
function logEvent(instrument, params) {
  if (!S.playing || !S.ctx) return;
  const now = S.ctx.currentTime;
  for (const t of S.tracks) {
    if (!t.armed || t.recordingType !== 'events') continue;
    if (now < t.recordingStartTime - 0.05) continue;
    if (now > t.recordingEndTime) continue;
    if (!t.recording) t.recording = true; // visual: recording started
    let rel = now - t.recordingStartTime;
    rel = ((rel % S.loopDuration) + S.loopDuration) % S.loopDuration;
    if (rel < 0.001) rel = 0;
    t.events.push({ time: rel, instrument, params, rate: params.rate ?? 1 });
  }
}

/* ═══════════════════════════════════════════════════════════
   7. INSTRUMENTS
   ═══════════════════════════════════════════════════════════ */
function playSound(params) {
  if (!S.sourceBuffer) { toast('Load a pet sound first 🐾'); return; }
  ensureCtx().then(() => {
    trigger(params, S.ctx.currentTime + 0.005, S.master, 1);
    logEvent(params._inst || 'unknown', params);
  });
}

// ----- KEYS -----
const KEYS = [
  { n:'C',  s:0,  kb:'A', black:false },
  { n:'C#', s:1,  kb:'W', black:true  },
  { n:'D',  s:2,  kb:'S', black:false },
  { n:'D#', s:3,  kb:'E', black:true  },
  { n:'E',  s:4,  kb:'D', black:false },
  { n:'F',  s:5,  kb:'F', black:false },
  { n:'F#', s:6,  kb:'T', black:true  },
  { n:'G',  s:7,  kb:'G', black:false },
  { n:'G#', s:8,  kb:'Y', black:true  },
  { n:'A',  s:9,  kb:'H', black:false },
  { n:'A#', s:10, kb:'U', black:true  },
  { n:'B',  s:11, kb:'J', black:false },
  { n:'C',  s:12, kb:'K', black:false },
];

function keyRate(semi) {
  const oct = S.keysOctave * 12;
  return Math.pow(2, (semi + oct) / 12);
}

function playKey(semi) {
  playSound({
    rate: keyRate(semi),
    gain: 0.9,
    decay: 0.5,
    _inst: 'keys',
  });
}

// ----- PADS -----
const PADS = [
  { name:'KICK',  rate:0.42, filter:{type:'lowpass', freq:340, q:0.7},  decay:0.36, gain:1.2  },
  { name:'KICK2', rate:0.56, filter:{type:'lowpass', freq:450, q:0.7},  decay:0.28, gain:1.1  },
  { name:'SNARE', rate:1.35, filter:{type:'bandpass', freq:1600, q:1.2},decay:0.18, gain:0.95 },
  { name:'SNR2',  rate:1.62, filter:{type:'highpass', freq:800, q:0.7}, decay:0.12, gain:0.9  },
  { name:'HAT',   rate:2.65, filter:{type:'highpass', freq:3200, q:0.7},decay:0.05, gain:0.55 },
  { name:'OHAT',  rate:2.35, filter:{type:'highpass', freq:2200, q:0.7},decay:0.28, gain:0.55 },
  { name:'RIM',   rate:2.20, filter:{type:'bandpass', freq:2200, q:2.0},decay:0.05, gain:0.7  },
  { name:'CLAP',  rate:1.75, filter:{type:'highpass', freq:1100, q:0.8},decay:0.16, gain:0.85 },
  { name:'TOML',  rate:0.68, filter:{type:'lowpass', freq:550, q:0.7},  decay:0.30, gain:0.95 },
  { name:'TOMM',  rate:0.88, filter:{type:'lowpass', freq:650, q:0.7},  decay:0.26, gain:0.95 },
  { name:'TOMH',  rate:1.10, filter:{type:'lowpass', freq:750, q:0.7},  decay:0.22, gain:0.95 },
  { name:'CRASH', rate:1.55, filter:{type:'highpass', freq:2000, q:0.5},decay:0.55, gain:0.7  },
];

function playPad(idx) {
  const p = PADS[idx]; if (!p) return;
  playSound({ rate:p.rate, filter:p.filter, decay:p.decay, gain:p.gain, _inst:'pads', _padIdx:idx });
}

// ----- SHAKER -----
const SHAKER_STYLES = {
  tick:  { rate:3.0, filter:{type:'highpass', freq:4200, q:0.7}, decay:0.035, gain:0.55 },
  shake: { rate:2.4, filter:{type:'highpass', freq:3000, q:0.7}, decay:0.065, gain:0.6  },
  swish: { rate:1.9, filter:{type:'highpass', freq:2000, q:0.7}, decay:0.14,  gain:0.55 },
  tsss:  { rate:2.8, filter:{type:'highpass', freq:5000, q:0.6}, decay:0.09,  gain:0.6  },
};

function playShaker() {
  const st = SHAKER_STYLES[S.shakerStyle] || SHAKER_STYLES.tick;
  playSound({ rate:st.rate, filter:st.filter, decay:st.decay, gain:st.gain, _inst:'shaker' });
}

/* ═══════════════════════════════════════════════════════════
   8. SOURCE LOADING
   ═══════════════════════════════════════════════════════════ */
async function enableMic() {
  await ensureCtx();
  if (S.micStream) { toast('Mic already on'); return; }
  try {
    S.micStream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false }
    });
  } catch (e) {
    toast('Mic blocked — HTTPS or localhost needed');
    return;
  }
  // load worklet
  if (!S.micWorkletReady) {
    const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: 'application/javascript' }));
    try { await S.ctx.audioWorklet.addModule(url); }
    catch (e) { toast('Worklet unsupported'); URL.revokeObjectURL(url); return; }
    URL.revokeObjectURL(url);
    S.micWorkletReady = true;
  }
  S.micNode = new AudioWorkletNode(S.ctx, 'mic-engine', {
    numberOfInputs:1, numberOfOutputs:1, outputChannelCount:[1],
  });
  S.micNode.port.onmessage = onMicMessage;
  const silent = S.ctx.createGain(); silent.gain.value = 0;
  S.micNode.connect(silent).connect(S.ctx.destination);
  const src = S.ctx.createMediaStreamSource(S.micStream);
  src.connect(S.micNode);

  const btn = document.getElementById('micBtn');
  btn.classList.add('live');
  btn.textContent = '🎤 Mic Live';
  document.getElementById('snagBtn').disabled = false;
  toast('🎤 Listening — go annoy your pet');
}

const micPeaks = [];
const MAX_MIC_PEAKS = 220;

function onMicMessage(e) {
  const d = e.data;
  if (d.type === 'peaks') {
    for (const v of d.values) micPeaks.push(v);
    while (micPeaks.length > MAX_MIC_PEAKS) micPeaks.shift();
  } else if (d.type === 'snagged') {
    const buf = S.ctx.createBuffer(1, d.samples.length, d.sampleRate);
    buf.copyToChannel(d.samples, 0);
    setSource(buf, 'Snagged ' + d.samples.length + 's');
    playPreview(buf);
    toast('✂️ Snagged! Now play it');
  } else if (d.type === 'vocal-captured') {
    const track = S.tracks.find(t => t.id === d.trackId);
    if (!track) return;
    const buf = S.ctx.createBuffer(1, d.samples.length, d.sampleRate);
    buf.copyToChannel(d.samples, 0);
    track.vocalBuffer = buf;
    track.events = [];
    track.recording = false;
    track.armed = false;
    toast('🎤 Vocal loop captured on ' + track.name);
    renderTracks();
  }
}

function setSource(buffer, name) {
  S.sourceBuffer = buffer;
  S.sourceName = name;
  const el = document.getElementById('srcName');
  el.textContent = '● ' + name;
  el.classList.remove('empty');
}

function playPreview(buffer) {
  ensureCtx().then(() => {
    const src = S.ctx.createBufferSource();
    src.buffer = buffer;
    src.connect(S.master);
    src.start();
  });
}

function snag() {
  if (!S.micNode) { toast('Enable mic first'); return; }
  S.micNode.port.postMessage({ type: 'snag', seconds: S.snagSeconds });
}

// Demo pet sound — synthesized meow-ish blip
async function loadDemo() {
  await ensureCtx();
  const sr = S.ctx.sampleRate;
  const dur = 0.42;
  const buf = S.ctx.createBuffer(1, Math.floor(sr * dur), sr);
  const d = buf.getChannelData(0);
  let ph = 0;
  for (let i = 0; i < d.length; i++) {
    const t = i / sr;
    const p = t / dur;
    const f = 620 + 280 * Math.sin(Math.PI * Math.min(1, p * 1.15)) - 200 * p;
    ph += (2 * Math.PI * f) / sr;
    const env = Math.min(1, p * 12) * Math.pow(1 - p, 1.5);
    const v = Math.sin(ph) * 0.55 + Math.sin(ph * 2) * 0.25 + Math.sin(ph * 3.03) * 0.1;
    d[i] = v * env * 0.85;
  }
  setSource(buf, 'Demo Meow');
  playPreview(buf);
  toast('🎲 Demo pet sound loaded');
}

async function loadFile(file) {
  await ensureCtx();
  const ab = await file.arrayBuffer();
  try {
    const buf = await S.ctx.decodeAudioData(ab);
    setSource(buf, file.name.replace(/\.[^.]+$/, '').slice(0, 24));
    playPreview(buf);
    toast('📁 Loaded ' + file.name);
  } catch (e) {
    toast('Could not decode audio file');
  }
}

/* ═══════════════════════════════════════════════════════════
   9. UI RENDERING
   ═══════════════════════════════════════════════════════════ */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function updateTransportUI() {
  const b = $('#playBtn');
  b.classList.toggle('on', S.playing);
  b.textContent = S.playing ? '■' : '▶';
}

/* ----- TRACKS ----- */
function renderTracks() {
  const wrap = $('#tracks');
  wrap.innerHTML = '';
  for (const t of S.tracks) {
    const c = COLORS[t.id];
    const el = document.createElement('div');
    el.className = 'track';
    el.dataset.id = t.id;
    el.style.setProperty('--tc', c.main);
    if (t.armed) el.classList.add('armed');
    if (t.recording) el.classList.add('recording');

    const status = t.vocalBuffer ? 'VOCAL LOOP'
                  : t.events.length ? t.events.length + ' HITS'
                  : t.armed ? (t.recordingType === 'vocal' ? 'READY TO SING' : 'ARMED — PLAY NOW')
                  : 'EMPTY';

    el.innerHTML = `
      <div class="track-badge">
        <span class="track-dot"></span>
        <span class="track-name">${t.name}</span>
        <span class="track-status">${status}</span>
      </div>
      <div class="track-ctrls">
        <button class="rec-btn ${t.recording?'rec-on':(t.armed?'armed':'')}" data-act="rec">
          <span class="led"></span>${t.recording?'REC':(t.armed?'ARMED':'REC')}
        </button>
        <div class="mini">
          <label>VOL</label>
          <input type="range" min="0" max="100" value="${Math.round(t.vol*100)}" data-act="vol">
        </div>
        <div class="mini">
          <label>PITCH</label>
          <input type="range" min="50" max="200" value="${Math.round(t.pitch*100)}" data-act="pitch">
        </div>
        <button class="mini-btn ${t.muted?'on':''}" data-act="mute" title="Mute">M</button>
        <button class="mini-btn danger" data-act="clear" title="Clear">×</button>
      </div>
      <div class="track-viz"><canvas></canvas><div class="playhead"></div><div class="recbar"></div></div>
    `;
    wrap.appendChild(el);

    // draw canvas
    const canvas = el.querySelector('canvas');
    requestAnimationFrame(() => drawTrackCanvas(canvas, t));

    // wire controls
    el.querySelector('[data-act="rec"]').onclick = () => armTrack(t, 'events');
    el.querySelector('[data-act="mute"]').onclick = (e) => {
      t.muted = !t.muted;
      if (t.gain) t.gain.gain.value = t.muted ? 0 : t.vol;
      renderTracks();
    };
    el.querySelector('[data-act="clear"]').onclick = () => {
      t.events = []; t.vocalBuffer = null; t.armed = false; t.recording = false;
      renderTracks(); toast('Cleared ' + t.name);
    };
    el.querySelector('[data-act="vol"]').oninput = (e) => {
      t.vol = +e.target.value / 100;
      if (t.gain) t.gain.gain.value = t.muted ? 0 : t.vol;
    };
    el.querySelector('[data-act="pitch"]').oninput = (e) => {
      t.pitch = +e.target.value / 100;
    };
  }
}

function drawTrackCanvas(canvas, track) {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth || 400;
  const h = canvas.clientHeight || 28;
  canvas.width = Math.floor(w * dpr);
  canvas.height = Math.floor(h * dpr);
  const g = canvas.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);

  const c = COLORS[track.id];

  if (track.vocalBuffer) {
    // draw waveform
    const data = track.vocalBuffer.getChannelData(0);
    const step = Math.max(1, Math.floor(data.length / w));
    g.fillStyle = c.main;
    for (let x = 0; x < w; x++) {
      let min = 1, max = -1;
      const base = x * step;
      for (let i = 0; i < step; i++) {
        const v = data[base + i] || 0;
        if (v < min) min = v;
        if (v > max) max = v;
      }
      const y0 = (1 - max) * (h / 2);
      const y1 = (1 - min) * (h / 2);
      g.globalAlpha = 0.7;
      g.fillRect(x, y0, 1, Math.max(1, y1 - y0));
    }
    g.globalAlpha = 1;
  } else if (track.events.length) {
    // draw events as vertical bars
    for (const ev of track.events) {
      const x = (ev.time / S.loopDuration) * w;
      const intensity = (ev.params.gain ?? 0.9);
      const barH = Math.max(2, Math.min(h - 4, (intensity * 0.9) * (h - 6)));
      g.fillStyle = c.main;
      g.globalAlpha = 0.75 + intensity * 0.25;
      g.fillRect(x - 1, (h - barH) / 2, 2, barH);
    }
    g.globalAlpha = 1;
    // baseline
    g.fillStyle = 'rgba(255,255,255,.04)';
    g.fillRect(0, h/2 - 0.5, w, 1);
  } else {
    // empty grid
    g.strokeStyle = 'rgba(255,255,255,.05)';
    g.beginPath();
    for (let i = 0; i <= 16; i++) {
      const x = (i / 16) * w;
      g.moveTo(x, 0); g.lineTo(x, h);
    }
    g.stroke();
  }
}

/* ----- VISUAL LOOP ----- */
function startVisualLoop() {
  if (S.rafId) cancelAnimationFrame(S.rafId);
  const step = () => {
    if (!S.playing || !S.ctx) return;
    const now = S.ctx.currentTime;
    const posInLoop = ((now - S.transportStart) % S.loopDuration + S.loopDuration) % S.loopDuration;
    const frac = posInLoop / S.loopDuration;

    document.querySelectorAll('.track-viz .playhead').forEach(e => {
      e.style.setProperty('--ph', frac);
    });

    // recording bar
    for (const t of S.tracks) {
      const el = document.querySelector('.track[data-id="' + t.id + '"]');
      if (!el) continue;
      const bar = el.querySelector('.recbar');
      if (!bar) continue;
      if (t.recording || (t.armed && now > t.recordingStartTime)) {
        const f = Math.max(0, Math.min(1, (now - t.recordingStartTime) / S.loopDuration));
        bar.style.width = (f * 100) + '%';
      } else {
        bar.style.width = '0%';
      }
    }
    S.rafId = requestAnimationFrame(step);
  };
  S.rafId = requestAnimationFrame(step);
}

/* ----- TAB ----- */
function renderTab() {
  const body = $('#tabBody');
  body.innerHTML = '';
  $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.activeTab));

  if (S.activeTab === 'keys') renderKeys(body);
  else if (S.activeTab === 'pads') renderPads(body);
  else if (S.activeTab === 'shaker') renderShaker(body);
  else if (S.activeTab === 'vox') renderVox(body);
}

function renderKeys(body) {
  const wrap = document.createElement('div');
  wrap.className = 'keys-wrap';

  const whiteKeys = KEYS.filter(k => !k.black);
  const blackKeys = KEYS.filter(k => k.black);

  const keysEl = document.createElement('div');
  keysEl.className = 'keys';

  // white keys — flex
  const whiteWidths = [];
  const totalWhite = whiteKeys.length;
  // render whites first (they define layout)
  let whiteIdx = 0;
  for (const k of KEYS) {
    if (k.black) continue;
    const el = document.createElement('div');
    el.className = 'key white';
    el.dataset.semi = k.s;
    el.innerHTML = `<span>${k.n}</span><span class="kb">${k.kb}</span>`;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pressKey(k.s, el);
    });
    keysEl.appendChild(el);
    whiteIdx++;
  }

  // black keys — absolutely positioned over the whites
  const whiteCount = whiteKeys.length;
  // positions: after white index i (i from 0..whiteCount-1), black key sits between i and i+1
  // KEYS order defines where blacks go.
  // compute offsets: each white = 100/whiteCount % width
  // find black key placement by counting whites before it
  let whitesBefore = 0;
  const keyIndexMap = {};
  for (let i = 0; i < KEYS.length; i++) {
    keyIndexMap[KEYS[i].s] = { whitesBefore, isBlack: KEYS[i].black };
    if (!KEYS[i].black) whitesBefore++;
  }

  for (const k of blackKeys) {
    const info = keyIndexMap[k.s];
    const el = document.createElement('div');
    el.className = 'key black';
    el.dataset.semi = k.s;
    el.innerHTML = `<span class="kb">${k.kb}</span>`;
    // position at (info.whitesBefore) * (100/whiteCount)% minus half its width
    const pct = (info.whitesBefore / whiteCount) * 100;
    el.style.left = `calc(${pct}% - 13px)`;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      pressKey(k.s, el);
    });
    keysEl.appendChild(el);
  }

  wrap.appendChild(keysEl);

  const footer = document.createElement('div');
  footer.className = 'keys-footer';
  footer.innerHTML = `
    <span class="hint">KEYS: A W S E D F T G Y H U J K · ONE OCTAVE</span>
    <div class="oct-ctl">
      <label>OCTAVE</label>
      <button class="mini-btn" data-act="octdn">−</button>
      <span style="font-size:10px; color:var(--cyan); min-width:26px; text-align:center">${S.keysOctave >= 0 ? '+' : ''}${S.keysOctave}</span>
      <button class="mini-btn" data-act="octup">+</button>
    </div>
  `;
  wrap.appendChild(footer);
  body.appendChild(wrap);

  footer.querySelector('[data-act="octdn"]').onclick = () => { S.keysOctave = Math.max(-2, S.keysOctave - 1); renderTab(); };
  footer.querySelector('[data-act="octup"]').onclick = () => { S.keysOctave = Math.min(2, S.keysOctave + 1); renderTab(); };
}

function pressKey(semi, el) {
  if (el.classList.contains('pressed')) return;
  el.classList.add('pressed');
  setTimeout(() => el.classList.remove('pressed'), 140);
  playKey(semi);
}

function renderPads(body) {
  const wrap = document.createElement('div');
  wrap.className = 'pads-wrap';
  const pads = document.createElement('div');
  pads.className = 'pads';

  // keyboard row layouts for pads
  const padKeys = ['1','2','3','4','Q','W','E','R','A','S','D','F'];

  PADS.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = 'pad';
    el.dataset.idx = i;
    el.innerHTML = `
      <span class="pdot"></span>
      <span class="pname">${p.name}</span>
      <span class="pkey">${padKeys[i]}</span>
    `;
    el.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      hitPad(i, el);
    });
    pads.appendChild(el);
  });
  wrap.appendChild(pads);
  body.appendChild(wrap);
}

function hitPad(idx, el) {
  el = el || document.querySelector('.pad[data-idx="' + idx + '"]');
  if (el) {
    el.classList.add('hit');
    setTimeout(() => el.classList.remove('hit'), 110);
  }
  playPad(idx);
}

function renderShaker(body) {
  const wrap = document.createElement('div');
  wrap.className = 'shaker-wrap';

  const big = document.createElement('button');
  big.className = 'shaker-big';
  big.innerHTML = `🪇<small>SHAKE</small>`;
  big.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    big.classList.add('hit');
    setTimeout(() => big.classList.remove('hit'), 100);
    playShaker();
  });
  wrap.appendChild(big);

  const styles = document.createElement('div');
  styles.className = 'shaker-styles';
  Object.keys(SHAKER_STYLES).forEach(k => {
    const b = document.createElement('button');
    b.className = 'shaker-style' + (S.shakerStyle === k ? ' on' : '');
    b.textContent = k.toUpperCase();
    b.onclick = () => { S.shakerStyle = k; renderTab(); };
    styles.appendChild(b);
  });
  wrap.appendChild(styles);

  const controls = document.createElement('div');
  controls.className = 'shaker-controls';
  const roll = document.createElement('button');
  roll.className = 'roll-btn' + (S.rollOn ? ' on' : '');
  roll.textContent = S.rollOn ? '■ STOP ROLL' : '▶ SHAKE ROLL (16ths)';
  roll.onclick = () => toggleRoll();
  controls.appendChild(roll);
  wrap.appendChild(controls);

  const hint = document.createElement('div');
  hint.className = 'vox-hint';
  hint.textContent = 'TAP THE BIG BUTTON · OR PRESS [Z] · TOGGLE THE ROLL FOR A CONTINUOUS SHAKER';
  wrap.appendChild(hint);

  body.appendChild(wrap);
}

function toggleRoll() {
  S.rollOn = !S.rollOn;
  if (S.rollTimer) { clearInterval(S.rollTimer); S.rollTimer = null; }
  if (S.rollOn) {
    const sub = 60 / S.bpm / 4; // 16th note
    S.rollTimer = setInterval(() => { playShaker(); }, sub * 1000);
  }
  if (S.activeTab === 'shaker') renderTab();
}

function renderVox(body) {
  const wrap = document.createElement('div');
  wrap.className = 'vox-wrap';

  // Which track has a vocal buffer? show the most recent
  const vocalTrack = S.tracks.find(t => t.vocalBuffer);

  const btn = document.createElement('button');
  btn.className = 'vox-rec';
  // is any track armed for vocal right now?
  const armedVox = S.tracks.find(t => t.armed && t.recordingType === 'vocal');
  if (armedVox) {
    btn.classList.add(armedVox.recording ? 'rec' : 'armed');
  }
  btn.innerHTML = `🎤<small>${armedVox ? (armedVox.recording ? 'RECORDING' : 'READY') : 'REC VOCAL'}</small>`;
  btn.onclick = () => {
    if (!S.micNode) { toast('Enable mic first 🎤'); return; }
    if (armedVox) {
      // cancel
      armedVox.armed = false; armedVox.recording = false; armedVox.recordingType = null;
      if (S.micNode) S.micNode.port.postMessage({ type: 'rec-stop', trackId: armedVox.id });
      renderTracks(); renderTab();
      return;
    }
    const targetSel = document.getElementById('voxTarget');
    const tid = +targetSel.value;
    const track = S.tracks.find(t => t.id === tid) || S.tracks[3];
    armTrack(track, 'vocal');
    setTimeout(renderTab, 50);
  };
  wrap.appendChild(btn);

  const controls = document.createElement('div');
  controls.className = 'vox-controls';
  controls.innerHTML = `<span style="font-size:9px; color:var(--dim); letter-spacing:.12em">RECORD TO</span>`;
  const sel = document.createElement('select');
  sel.id = 'voxTarget';
  for (const t of S.tracks) {
    const o = document.createElement('option');
    o.value = t.id;
    o.textContent = t.name;
    if (t.vocalBuffer) o.textContent += ' (has vocal)';
    sel.appendChild(o);
  }
  sel.value = vocalTrack ? vocalTrack.id : 3;
  controls.appendChild(sel);

  // pitch for the vocal track
  if (vocalTrack) {
    const pitchWrap = document.createElement('div');
    pitchWrap.style.cssText = 'display:flex; align-items:center; gap:6px;';
    pitchWrap.innerHTML = `<span style="font-size:9px; color:var(--dim); letter-spacing:.12em">PITCH</span>`;
    const pitchIn = document.createElement('input');
    pitchIn.type = 'range'; pitchIn.min = '50'; pitchIn.max = '200'; pitchIn.value = Math.round(vocalTrack.pitch*100);
    pitchIn.oninput = (e) => { vocalTrack.pitch = +e.target.value / 100; };
    pitchWrap.appendChild(pitchIn);
    controls.appendChild(pitchWrap);
  }
  wrap.appendChild(controls);

  // Vocal waveform
  const cv = document.createElement('canvas');
  cv.className = 'vox-wave';
  wrap.appendChild(cv);
  requestAnimationFrame(() => {
    const dpr = window.devicePixelRatio || 1;
    const w = cv.clientWidth || 400, h = cv.clientHeight || 70;
    cv.width = Math.floor(w * dpr); cv.height = Math.floor(h * dpr);
    const g = cv.getContext('2d');
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, w, h);
    if (vocalTrack) {
      const data = vocalTrack.vocalBuffer.getChannelData(0);
      const step = Math.max(1, Math.floor(data.length / w));
      g.fillStyle = COLORS[vocalTrack.id].main;
      for (let x = 0; x < w; x++) {
        let min = 1, max = -1;
        const base = x * step;
        for (let i = 0; i < step; i++) {
          const v = data[base + i] || 0;
          if (v < min) min = v;
          if (v > max) max = v;
        }
        const y0 = (1 - max) * (h / 2);
        const y1 = (1 - min) * (h / 2);
        g.fillRect(x, y0, 1, Math.max(1, y1 - y0));
      }
    } else {
      g.fillStyle = 'rgba(255,255,255,.08)';
      g.fillRect(0, h/2 - 0.5, w, 1);
    }
  });

  const hint = document.createElement('div');
  hint.className = 'vox-hint';
  hint.textContent = 'TAP THE MIC. RECORDING STARTS ON THE NEXT LOOP — SING FOR ONE FULL LOOP. IT\'LL LOOP FOREVER.';
  wrap.appendChild(hint);

  body.appendChild(wrap);
}

/* ═══════════════════════════════════════════════════════════
   10. MIC WAVE VISUAL
   ═══════════════════════════════════════════════════════════ */
const micCanvas = document.getElementById('micWave');
const micCtx = micCanvas.getContext('2d');
function sizeMicCanvas() {
  const dpr = window.devicePixelRatio || 1;
  const w = micCanvas.clientWidth || 600;
  const h = micCanvas.clientHeight || 64;
  micCanvas.width = Math.floor(w * dpr);
  micCanvas.height = Math.floor(h * dpr);
  micCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
sizeMicCanvas();
window.addEventListener('resize', sizeMicCanvas);

function drawMic() {
  requestAnimationFrame(drawMic);
  const w = micCanvas.clientWidth || 600;
  const h = micCanvas.clientHeight || 64;
  micCtx.clearRect(0, 0, w, h);
  // center
  micCtx.strokeStyle = 'rgba(255,255,255,.07)';
  micCtx.beginPath();
  micCtx.moveTo(0, h/2); micCtx.lineTo(w, h/2); micCtx.stroke();
  if (!micPeaks.length) {
    micCtx.fillStyle = 'rgba(139,123,168,.5)';
    micCtx.font = '10px ui-monospace, monospace';
    micCtx.textAlign = 'center';
    micCtx.fillText('MIC OFF — TAP "ENABLE MIC" TO START LISTENING', w/2, h/2 + 3);
    return;
  }
  const barW = w / MAX_MIC_PEAKS;
  const highlightFrom = MAX_MIC_PEAKS - Math.round(S.snagSeconds * (48000/1024));
  for (let i = 0; i < micPeaks.length; i++) {
    const p = Math.min(1, micPeaks[i] * 3.2);
    const bh = Math.max(1.5, p * h * 0.9);
    const x = i * barW;
    micCtx.fillStyle = i >= highlightFrom ? '#ff2e97' : 'rgba(0,229,255,.55)';
    micCtx.fillRect(x, (h - bh)/2, Math.max(1, barW - 1), bh);
  }
}
drawMic();

/* ═══════════════════════════════════════════════════════════
   11. KEYBOARD SHORTCUTS
   ═══════════════════════════════════════════════════════════ */
const KEY_MAP_KEYS = {};  // kb letter -> semi
for (const k of KEYS) KEY_MAP_KEYS[k.kb] = k.s;

const PAD_KEY_MAP = {};
['1','2','3','4','Q','W','E','R','A','S','D','F'].forEach((k, i) => PAD_KEY_MAP[k] = i);

const keyHeld = new Set();

window.addEventListener('keydown', (e) => {
  if (/INPUT|SELECT|TEXTAREA/.test(e.target.tagName)) return;
  const k = e.key.toUpperCase();

  if (e.code === 'Space') {
    e.preventDefault();
    if (!S.playing) startTransport(); else stopTransport();
    return;
  }

  if (S.activeTab === 'keys') {
    if (KEY_MAP_KEYS[k] !== undefined && !keyHeld.has(k)) {
      keyHeld.add(k);
      const el = document.querySelector('.key[data-semi="' + KEY_MAP_KEYS[k] + '"]');
      pressKey(KEY_MAP_KEYS[k], el);
    }
  } else if (S.activeTab === 'pads') {
    if (PAD_KEY_MAP[k] !== undefined && !keyHeld.has(k)) {
      keyHeld.add(k);
      hitPad(PAD_KEY_MAP[k]);
    }
  } else if (S.activeTab === 'shaker') {
    if (k === 'Z' && !keyHeld.has(k)) {
      keyHeld.add(k);
      playShaker();
    }
  }
});

window.addEventListener('keyup', (e) => {
  keyHeld.delete(e.key.toUpperCase());
});

/* ═══════════════════════════════════════════════════════════
   12. UI EVENT WIRING
   ═══════════════════════════════════════════════════════════ */
$('#playBtn').onclick = () => S.playing ? stopTransport() : startTransport();

$('#bpm').oninput = (e) => {
  S.bpm = +e.target.value;
  $('#bpmV').textContent = S.bpm;
  updateLoopDuration();
  if (S.rollOn) { clearInterval(S.rollTimer); S.rollTimer = setInterval(playShaker, 60/S.bpm/4*1000); }
};

$('#vol').oninput = (e) => {
  S.volume = +e.target.value / 100;
  if (S.master) S.master.gain.value = S.volume;
};

$$('#barsSeg button').forEach(b => b.onclick = () => {
  $$('#barsSeg button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  S.bars = +b.dataset.v;
  updateLoopDuration();
  renderTracks();
});

$$('#snagLen button').forEach(b => b.onclick = () => {
  $$('#snagLen button').forEach(x => x.classList.remove('on'));
  b.classList.add('on');
  S.snagSeconds = +b.dataset.v;
});

$('#micBtn').onclick = enableMic;
$('#snagBtn').onclick = snag;
$('#demoBtn').onclick = loadDemo;
$('#fileIn').onchange = (e) => {
  const f = e.target.files[0];
  if (f) loadFile(f);
};

$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('button');
  if (!b) return;
  S.activeTab = b.dataset.tab;
  renderTab();
});

// unlock ctx on first interaction
window.addEventListener('pointerdown', function unlock() {
  ensureCtx();
  window.removeEventListener('pointerdown', unlock);
}, { once: true });

/* ═══════════════════════════════════════════════════════════
   13. BOOT
   ═══════════════════════════════════════════════════════════ */
renderTracks();
renderTab();
updateTransportUI();

// small welcome
setTimeout(() => toast('🐾 Enable mic, snag a pet sound, then arm a track'), 700);

})();
